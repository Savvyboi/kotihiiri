# Site-wide settings. The crawler refuses to run until site_domain and
# contact_email are set (PLAN.md §2.1 rule 3, §17).
site_name: Kotihiiri
site_domain: kotihiiri.eu   # R2 bucket kotihiiri-site via Cloudflare (PLAN.md §18.4); used in the User-Agent and /tietoa link
contact_email: saivanidis.savvas@gmail.com   # where cities can reach us about the crawler
user_agent_template: "KuntaDataBot/0.1 (+https://{site_domain}/tietoa; {contact_email})"
data_licence: CC-BY-4.0
since: "2025-01-01"
# OpenRouter models for the AI briefs (`kunta briefs`, PLAN.md §20), tried in order. Free model ids
# change now and then: `kunta briefs --list-models` prints the current ones.
briefs_models:
  - nvidia/nemotron-3-nano-30b-a3b:free
  - nvidia/nemotron-nano-9b-v2:free
features:
  SPEECHES_BY_PERSON: true   # legal check in PLAN.md §2.2 rule 9 confirmed by Savvas on 2026-10-14
# Paths read despite robots.txt, each approved by a human (PLAN.md §2.1 rule 1, §17). Used only by
# the commands that name them; the polite client's rate limit and retries still apply.
robots_exceptions:
  - host: www.kuntalaisaloite.fi
    paths: ["/api/v1/"]
    approved_by: Savvas
    approved_on: "2026-10-18"
    reason: >-
      The Ministry of Justice publishes /api/v1/ as the service's Open Data API; robots.txt ends in
      "User-agent: * / Disallow: /" with no Allow for it. Only the API is read, at 1 request/second.
# Municipalities crawled although their robots.txt disallows us (PLAN.md §2.1 rule 1b). Switched on
# by Savvas on 2026-11-15. Only Disallow rules in a robots.txt the host served are set aside: a host
# that answers robots.txt with 401/403/5xx, or not at all, stays blocked, and a 401/403 (or a 429
# that outlasts the retries) during a run stops all requests to that host for the run. Same
# User-Agent with our contact address; at most one request every `min_interval_s` seconds per host
# (or the host's Crawl-delay, if longer). Listed: the 26 registry municipalities whose robots.txt
# disallowed our paths in the 2026-10-15 audit (data/state/robots.json), and Oulu and Turku (added
# 2026-11-15, when Savvas dropped the earlier wait for their written permission). Not listed: the five
# whose host did not answer the audit (Vaasa, Äänekoski, Kalajoki, Maarianhamina, Pedersöre).
robots_override:
  enabled: true
  approved_by: Savvas
  approved_on: "2026-11-15"
  min_interval_s: 5
  municipalities:
    # Two of the six cities: Oulu on Tweb, Turku on its own portal (JSON API, kunta/adapters/turku.py)
    - oulu
    - turku
    # Tweb on *.tweb.fi
    - hameenlinna
    - rauma
    - kerava
    - nokia
    - kangasala
    - pirkkala
    - valkeakoski
    - varkaus
    - akaa
    - janakkala
    - kuusamo
    - ilmajoki
    - muurame
    # Tweb on *.triplancloud.fi
    - raasepori
    - lieto
    - hamina
    - kauhajoki
    # Tweb, self-hosted
    - seinajoki
    - kaarina
    - riihimaki
    - iisalmi
    - pietarsaari
    - pieksamaki
    # Dynasty, self-hosted
    - lohja
    - ylivieska
    - nivala
