  - lahti
  - salo
  - kokkola
  - nurmijarvi
  - tuusula
  - kirkkonummi
  - ylojarvi
  - savonlinna
  - vihti
  - jyvaskyla
  - pori
  - rovaniemi
  - mikkeli
  - jarvenpaa
  - kajaani
  - hollola
  - kempele
  - lapua
  - hameenkyro

# Per-municipality corrections found by the audit, merged over the registry row
# (e.g. a council_source_id the registry lacked, or a moved base URL).
overrides: {}
