[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kunta"
version = "0.1.0"
description = "Scraper and data pipeline for decisions of Finland's six largest city councils"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "selectolax>=0.3.21",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pdfplumber>=0.11",
  "pydantic>=2.7,<3",
  "rapidfuzz>=3.9",
  "typer>=0.12",
  "pyyaml>=6.0",
  "orjson>=3.10",
  "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kunta = "kunta.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["kunta"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# One-off fixture generator; terse by design.
"scripts/make_demo_data.py" = ["E402", "E501", "E701", "E702", "F403", "F405"]
