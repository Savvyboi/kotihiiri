# Weekly crawl (PLAN.md §12). Helsinki (M1), Espoo (M2) and Tampere (M3). Crawls, validates, commits data/, then deploys
# the site through pages.yml. Does nothing until site_domain and contact_email are set in
# config/project.yaml, because both go into the crawler's User-Agent (§2.1 rule 3).
name: weekly

on:
  schedule:
    - cron: "23 3 * * 6" # Sat 03:23 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest meeting date"
        default: "2025-01-01"
      window_weeks:
        description: "Refetch meetings this many weeks back, or `all` for everything since `since` (re-parses stored items)"
        default: "10"
      cities:
        description: "Cities to crawl, comma-separated"
        default: "helsinki,espoo,tampere,vantaa"
      body:
        description: "Only this body slug (e.g. kaupunginvaltuusto); empty = all bodies"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      cities: ${{ steps.cities.outputs.json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: |
          pip install -q pyyaml
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          p = yaml.safe_load(open("config/project.yaml"))
          print("ready=" + ("true" if p.get("site_domain") and p.get("contact_email") else "false"))
          PY
      - id: cities
        env:
          CITIES: ${{ inputs.cities || 'helsinki,espoo,tampere,vantaa' }}
        run: echo "json=$(python -c 'import json,os; print(json.dumps([c.strip() for c in os.environ["CITIES"].split(",") if c.strip()]))')" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready != 'true'
        run: echo "::warning::config/project.yaml has no site_domain/contact_email yet; skipping the crawl."

  crawl:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        city: ${{ fromJSON(needs.preflight.outputs.cities) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - id: week
        run: echo "iso=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: raw-${{ matrix.city }}-${{ steps.week.outputs.iso }}
          restore-keys: raw-${{ matrix.city }}-
      - name: Crawl
        id: crawl
        env:
          SINCE: ${{ inputs.since || '2025-01-01' }}
          WINDOW: ${{ github.event_name == 'schedule' && '10' || inputs.window_weeks }}
          BODY: ${{ inputs.body || '' }}
        run: |
          set +e
          args=(--city "${{ matrix.city }}" --since "$SINCE" --max-minutes 300)
          if [ -n "$WINDOW" ] && [ "$WINDOW" != "all" ]; then args+=(--window-weeks "$WINDOW"); fi
          if [ -n "$BODY" ]; then args+=(--body "$BODY"); fi
          kunta crawl "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - run: kunta validate --city ${{ matrix.city }}
      # Only data that validated and raised no layout alarm reaches the commit job (§10: a failing
      # city is left out; the others still commit).
      - uses: actions/upload-artifact@v4
        if: success() && steps.crawl.outputs.code == '0'
        with:
          name: data-${{ matrix.city }}
          path: |
            data/${{ matrix.city }}/
            data/state/${{ matrix.city }}.json
            config/bodies/${{ matrix.city }}.yaml
          if-no-files-found: ignore
      - if: steps.crawl.outputs.code != '0'
        run: |
          echo "::error::kunta crawl exited with ${{ steps.crawl.outputs.code }} (2 = layout-change alarm)"
          exit 1

  commit:
    needs: [preflight, crawl]
    if: ${{ !cancelled() && needs.preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          merge-multiple: true
      - run: kunta heartbeat && kunta stats
      - name: Commit data
        run: |
          git config user.name "kotihiiri-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data config/bodies
          git diff --cached --quiet || git commit -m "data: weekly crawl $(date -u +%F)"
          # The branch can move during a long crawl (a merged PR); data commits only touch data/
          # and config/bodies, so rebasing onto it is safe.
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

  # A run dispatched on a PR branch (to try an adapter live) commits to that branch but never deploys.
  deploy:
    needs: commit
    if: ${{ !cancelled() && needs.commit.result == 'success' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/pages.yml
