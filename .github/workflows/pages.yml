# Deploys the site built from committed data/. weekly.yml calls this after it commits new data
# (pushes made with GITHUB_TOKEN do not trigger other workflows).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # when called from weekly.yml: the branch head with the new data commit
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # Downloads for /data/ (PLAN.md §13): Parquet per table, every CSV in all.zip. The per-table
      # CSVs stay out of the site; the sections table alone is over 100 MB as CSV.
      - name: Exports
        run: |
          kunta export --out build/exports
          mkdir -p site/public/data/files
          cp build/exports/*.parquet build/exports/all.zip build/exports/manifest.json site/public/data/files/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
