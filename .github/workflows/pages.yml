# Deploys the site built from committed data/. weekly.yml calls this after it commits new data
# (pushes made with GITHUB_TOKEN do not trigger other workflows).
# Two targets: GitHub Pages (build + deploy) and the R2 bucket kotihiiri-site behind site_domain
# (r2-ready + r2, PLAN.md §18.4). Pages keeps serving until the R2 site matches it page for page (M11);
# the R2 jobs skip themselves until the repository secrets from §18.6 step 4 exist.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # when called from weekly.yml: the branch head with the new data commit
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # Downloads for /data/ (PLAN.md §13): Parquet per table, every CSV in all.zip. The per-table
      # CSVs stay out of the site; the sections table alone is over 100 MB as CSV.
      - name: Exports
        run: |
          kunta export --out build/exports
          mkdir -p site/public/data/files
          cp build/exports/*.parquet build/exports/all.zip build/exports/manifest.json site/public/data/files/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  r2-ready:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$ACCOUNT" ] && [ -n "$KEY" ] && [ -n "$SECRET" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R2 secrets (CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) not set; skipping the R2 upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  # Same build as above, but for the root of https://<site_domain>/, then `rclone sync --checksum`
  # into kotihiiri-site: only files whose MD5 changed are uploaded, files gone from the build are deleted.
  r2:
    needs: r2-ready
    if: ${{ needs.r2-ready.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: r2-site
      cancel-in-progress: false
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Site URL from config/project.yaml
        id: site
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          print("url=https://" + yaml.safe_load(open("config/project.yaml"))["site_domain"].strip("/"))
          PY
      - name: Exports
        run: |
          kunta export --out build/exports
          mkdir -p site/public/data/files
          cp build/exports/*.parquet build/exports/all.zip build/exports/manifest.json site/public/data/files/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
          BASE_PATH: /
      # A broken build must not empty the bucket through sync's deletes.
      - name: Sanity check
        run: |
          test -f site/dist/index.html
          n=$(find site/dist -type f | wc -l)
          echo "$n files"
          test "$n" -ge 1000
      # Ubuntu's rclone (1.60) got a 501 NotImplemented from R2 on every file of the first upload;
      # use a current release instead.
      - name: Install rclone
        run: |
          curl -fsSL -o rclone.deb https://downloads.rclone.org/v1.71.0/rclone-v1.71.0-linux-amd64.deb
          sudo dpkg -i rclone.deb
          rclone version
      - name: Upload to R2
        # --s3-no-check-bucket: the token has object rights only, not bucket rights.
        # --max-delete: a guard on top of the sanity check; raise it if a real cleanup needs more.
        run: |
          rclone sync site/dist r2:kotihiiri-site \
            --checksum --s3-no-check-bucket --fast-list \
            --transfers 32 --checkers 64 --max-delete 5000 \
            --stats-one-line --stats 60s --stats-log-level NOTICE
      # rclone retries a failed sync and can report success on a later attempt; check the bucket
      # really holds every built file with the same MD5.
      - name: Verify R2
        run: rclone check site/dist r2:kotihiiri-site --one-way --checksum --s3-no-check-bucket --fast-list --checkers 64
