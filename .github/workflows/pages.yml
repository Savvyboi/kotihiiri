# Deploys the site built from committed data/. weekly.yml calls this after it commits new data
# (pushes made with GITHUB_TOKEN do not trigger other workflows).
# Two targets: GitHub Pages (build + deploy) and the R2 bucket kotihiiri-site behind site_domain
# (r2-ready + r2, PLAN.md §18.4). Pages keeps serving until the R2 site matches it page for page (M11);
# the R2 jobs skip themselves until the repository secrets from §18.6 step 4 exist.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      r2_reupload:
        description: Upload every file to R2 again, even unchanged ones (once, to give existing objects their Cache-Control header)
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # when called from weekly.yml: the branch head with the new data commit
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # Downloads for /data/ (PLAN.md §13): Parquet per table, every CSV in all.zip. The per-table
      # CSVs stay out of the site; the sections table alone is over 100 MB as CSV.
      - name: Exports
        run: |
          kunta export --out build/exports
          mkdir -p site/public/data/files
          cp build/exports/*.parquet build/exports/all.zip build/exports/manifest.json site/public/data/files/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  r2-ready:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$ACCOUNT" ] && [ -n "$KEY" ] && [ -n "$SECRET" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R2 secrets (CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) not set; skipping the R2 upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  # Same build as above, but for the root of https://<site_domain>/, then `rclone sync --checksum`
  # into kotihiiri-site: only files whose MD5 changed are uploaded, files gone from the build are deleted.
  r2:
    needs: r2-ready
    if: ${{ needs.r2-ready.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: r2-site
      cancel-in-progress: false
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Site URL from config/project.yaml
        id: site
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          print("url=https://" + yaml.safe_load(open("config/project.yaml"))["site_domain"].strip("/"))
          PY
      # Ubuntu's rclone (1.60) got a 501 NotImplemented from R2 on every file of the first upload;
      # use a current release instead.
      - name: Install rclone
        run: |
          curl -fsSL -o rclone.deb https://downloads.rclone.org/v1.71.0/rclone-v1.71.0-linux-amd64.deb
          sudo dpkg -i rclone.deb
          rclone version
      # Registry municipalities (ranks 7–96) keep their data only in kotihiiri-data (PLAN.md §18.4);
      # the six cities' data is in git. The GitHub Pages build above stays six-city.
      - name: Fetch registry data from R2
        run: rclone copy r2:kotihiiri-data/data data --checksum --s3-no-check-bucket --fast-list --exclude "state/**"
      - name: Exports
        run: |
          kunta export --out build/exports
          mkdir -p site/public/data/files
          cp build/exports/*.parquet build/exports/all.zip build/exports/manifest.json site/public/data/files/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
          BASE_PATH: /
      # A broken build must not empty the bucket through sync's deletes.
      - name: Sanity check
        run: |
          test -f site/dist/index.html
          n=$(find site/dist -type f | wc -l)
          echo "$n files"
          test "$n" -ge 1000
      # Four passes instead of one sync, so that:
      # - every object carries a Cache-Control header (R2 sends none of its own, and without one
      #   Cloudflare's edge never caches pages, JSON or the search index and browsers guess);
      # - files named by their content hash go up first, so a page uploaded later never points at a
      #   stylesheet or search chunk that isn't there yet.
      # Content-hashed files (Astro's CSS and fonts, Pagefind's chunks) never change under their name,
      # so browsers and the edge may keep them for a year. Pages, feeds, JSON, downloads and Pagefind's
      # entry files keep their names between builds, so they get five minutes: a deploy shows up within
      # that, and repeat views and the back button inside it cost no request. Images rarely change.
      # --header-upload only applies to files a pass uploads; an unchanged file keeps the header it was
      # uploaded with. Run this workflow by hand with r2_reupload once to set them on every object
      # (one Class A operation per file).
      - name: Upload to R2
        env:
          REUPLOAD: ${{ inputs.r2_reupload && '--ignore-times' || '' }}
        # --s3-no-check-bucket: the token has object rights only, not bucket rights.
        # --max-delete: a guard on top of the sanity check; raise it if a real cleanup needs more.
        run: |
          set -euo pipefail
          common=(--checksum --s3-no-check-bucket --fast-list --transfers 32 --checkers 64
                  --stats-one-line --stats 60s --stats-log-level NOTICE $REUPLOAD)
          hashed=(--include "/_astro/**" --include "/pagefind/fragment/**" --include "/pagefind/index/**"
                  --include "/pagefind/filter/**" --include "/pagefind/*.pf_meta")
          images=(--include "/images/**" --include "/favicon.svg")
          # 1. Content-hashed files, uploaded first and kept for a year.
          rclone copy site/dist r2:kotihiiri-site "${common[@]}" "${hashed[@]}" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable"
          # 2. City photos, coats of arms, favicon: fixed names that change only with config/images.yaml.
          rclone copy site/dist r2:kotihiiri-site "${common[@]}" "${images[@]}" \
            --header-upload "Cache-Control: public, max-age=86400"
          # 3. Everything else, deleting pages gone from the build (excluded paths are left alone).
          rclone sync site/dist r2:kotihiiri-site "${common[@]}" --max-delete 5000 \
            --exclude "/_astro/**" --exclude "/pagefind/fragment/**" --exclude "/pagefind/index/**" \
            --exclude "/pagefind/filter/**" --exclude "/pagefind/*.pf_meta" \
            --exclude "/images/**" --exclude "/favicon.svg" \
            --header-upload "Cache-Control: public, max-age=300"
          # 4. Now that no new page refers to them, delete search chunks and images gone from the build.
          #    Old /_astro/ files stay: they are small, and a page a browser or the edge still holds
          #    keeps its styles.
          rclone sync site/dist r2:kotihiiri-site --checksum --s3-no-check-bucket --fast-list --checkers 64 \
            --max-delete 5000 --include "/pagefind/fragment/**" --include "/pagefind/index/**" \
            --include "/pagefind/filter/**" --include "/pagefind/*.pf_meta" "${images[@]}"
      # rclone retries a failed sync and can report success on a later attempt; check the bucket
      # really holds every built file with the same MD5.
      - name: Verify R2
        run: rclone check site/dist r2:kotihiiri-site --one-way --checksum --s3-no-check-bucket --fast-list --checkers 64
