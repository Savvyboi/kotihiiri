# Rebuilds data/helsinki/speeches/ from the council's speech transcripts (PLAN.md M6) without a
# crawl. The weekly crawl runs the same step for new meetings; this one re-parses every stored
# transcript (--refresh) and runs on a working branch when the speech parser changes there.
name: speeches

on:
  push:
    branches: ["claude/**"]
    paths: [kunta/speeches.py, kunta/parsers/speeches_helsinki.py, .github/workflows/speeches.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  speeches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: .cache
          key: speeches-${{ github.run_id }}
          restore-keys: speeches-
      - run: kunta speeches --city helsinki --refresh
      - run: kunta validate --city helsinki
      - name: Commit speeches
        run: |
          git config user.name "kotihiiri-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/helsinki/speeches
          git diff --cached --quiet && exit 0
          git commit -m "data: speeches $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
