# One-off probe: the kuntalaisaloite.fi open API's shape (municipal initiatives). Output is the job
# log; nothing is stored. Runs on a working branch when the probe changes.
name: initiatives-probe

on:
  push:
    branches: ["claude/**"]
    paths: [scripts/probe_initiatives.py, .github/workflows/initiatives-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -u scripts/probe_initiatives.py
